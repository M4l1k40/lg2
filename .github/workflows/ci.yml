
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Verify the shared event library independently.
  shared-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify shared library
        working-directory: infrastructure/legalflow-events
        run: mvn -B verify

  # Verify each independently built backend module.
  backend:
    needs: shared-library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: gateway
            path: backend/gateway
          - module: appointment-service
            path: backend/services/appointment-service
          - module: billing-service
            path: backend/services/billing-service
          - module: case-service
            path: backend/services/case-service
          - module: client-service
            path: backend/services/client-service
          - module: consultation-service
            path: backend/services/consultation-service
          - module: deadline-service
            path: backend/services/deadline-service
          - module: document-service
            path: backend/services/document-service
          - module: judicial-service
            path: backend/services/judicial-service
          - module: notification-service
            path: backend/services/notification-service
          - module: user-service
            path: backend/services/user-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Install shared library for dependent modules
        if: contains(fromJSON('["case-service","consultation-service","notification-service"]'), matrix.module)
        working-directory: infrastructure/legalflow-events
        run: mvn -B install -DskipTests
      - name: Verify backend module
        working-directory: ${{ matrix.path }}
        run: mvn -B verify
      - name: Summarize Surefire tests
        if: always()
        working-directory: ${{ matrix.path }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          failed_tests = []

          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_tests.append(f'{case.attrib.get("classname", "")}#{case.attrib.get("name", "unknown")}')

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write(f'### {os.environ["MODULE"]} test results\n\n')
              if not reports:
                  output.write("No Surefire XML reports were produced.\n")
              output.write(
                  f'- Tests: {totals["tests"]}; failures: {totals["failures"]}; '
                  f'errors: {totals["errors"]}; skipped: {totals["skipped"]}\n'
              )
              output.write("- Failed tests: " + (", ".join(failed_tests) if failed_tests else "none") + "\n")
          PY
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.path }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Test and build the frontend.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Exercise the Dockerized application end-to-end on pull requests to main.
  integration:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker images
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: |
            infrastructure/docker-compose.yml
            infrastructure/docker-compose.user-service.yml
          load: true
          set: |
            appointment-service.tags=infrastructure-appointment-service
            appointment-service.cache-from=type=gha,scope=legalflow-appointment-service
            appointment-service.cache-to=type=gha,scope=legalflow-appointment-service,mode=max,ignore-error=true
            billing-service.tags=infrastructure-billing-service
            billing-service.cache-from=type=gha,scope=legalflow-billing-service
            billing-service.cache-to=type=gha,scope=legalflow-billing-service,mode=max,ignore-error=true
            case-service.tags=infrastructure-case-service
            case-service.cache-from=type=gha,scope=legalflow-case-service
            case-service.cache-to=type=gha,scope=legalflow-case-service,mode=max,ignore-error=true
            client-service.tags=infrastructure-client-service
            client-service.cache-from=type=gha,scope=legalflow-client-service
            client-service.cache-to=type=gha,scope=legalflow-client-service,mode=max,ignore-error=true
            consultation-service.tags=infrastructure-consultation-service
            consultation-service.cache-from=type=gha,scope=legalflow-consultation-service
            consultation-service.cache-to=type=gha,scope=legalflow-consultation-service,mode=max,ignore-error=true
            deadline-service.tags=infrastructure-deadline-service
            deadline-service.cache-from=type=gha,scope=legalflow-deadline-service
            deadline-service.cache-to=type=gha,scope=legalflow-deadline-service,mode=max,ignore-error=true
            document-service.tags=infrastructure-document-service
            document-service.cache-from=type=gha,scope=legalflow-document-service
            document-service.cache-to=type=gha,scope=legalflow-document-service,mode=max,ignore-error=true
            gateway.tags=infrastructure-gateway
            gateway.cache-from=type=gha,scope=legalflow-gateway
            gateway.cache-to=type=gha,scope=legalflow-gateway,mode=max,ignore-error=true
            judicial-service.tags=infrastructure-judicial-service
            judicial-service.cache-from=type=gha,scope=legalflow-judicial-service
            judicial-service.cache-to=type=gha,scope=legalflow-judicial-service,mode=max,ignore-error=true
            notification-service.tags=infrastructure-notification-service
            notification-service.cache-from=type=gha,scope=legalflow-notification-service
            notification-service.cache-to=type=gha,scope=legalflow-notification-service,mode=max,ignore-error=true
            user-service.tags=infrastructure-user-service
            user-service.cache-from=type=gha,scope=legalflow-user-service
            user-service.cache-to=type=gha,scope=legalflow-user-service,mode=max,ignore-error=true

            appointment-service.context=./backend/services/appointment-service
            billing-service.context=./backend/services/billing-service
            case-service.context=./backend/services/case-service
            client-service.context=./backend/services/client-service
            consultation-service.context=./backend/services/consultation-service
            deadline-service.context=./backend/services/deadline-service
            document-service.context=./backend/services/document-service
            gateway.context=./backend/gateway
            judicial-service.context=./backend/services/judicial-service
            notification-service.context=./backend/services/notification-service
            user-service.context=./backend/services/user-service

      - name: Start Docker Compose stack
        run: docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml up -d
      - name: Wait for services to become ready
        shell: bash
        run: |
          timeout_seconds=900
          start_time=$(date +%s)
          databases=(
            legalflow-postgres
            legalflow-case-db
            legalflow-judicial-db
            legalflow-document-db
            legalflow-deadline-db
            legalflow-billing-db
            legalflow-consultation-db
            legalflow-appointment-db
            legalflow-notification-db
          )
          ports=(8081 8082 8083 8084 8085 8086 8087 8088 8089 8090 9000)

          while true; do
            ready=true
            for container in "${databases[@]}"; do
              if ! health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null); then
                health=missing
              fi
              if [[ "$health" != "healthy" ]]; then
                ready=false
              fi
            done

            if ! health=$(docker inspect --format='{{.State.Health.Status}}' legalflow-rabbitmq 2>/dev/null) || [[ "$health" != "healthy" ]]; then
              ready=false
            fi
            if ! health=$(docker inspect --format='{{.State.Health.Status}}' legalflow-keycloak 2>/dev/null) || [[ "$health" != "healthy" ]]; then
              ready=false
            fi
            if ! curl --fail --silent http://localhost:8080/realms/legalflow/.well-known/openid-configuration >/dev/null; then
              ready=false
            fi
            for port in "${ports[@]}"; do
              if ! curl --fail --silent "http://localhost:${port}/actuator/health" >/dev/null; then
                ready=false
              fi
            done

            if [[ "$ready" == "true" ]]; then
              echo "Keycloak, RabbitMQ, databases, and application services are ready."
              break
            fi

            now=$(date +%s)
            elapsed=$((now - start_time))
            if (( elapsed >= timeout_seconds )); then
              echo "Services did not become ready within ${timeout_seconds} seconds."
              docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml ps --all
              docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml logs --no-color --tail=100
              exit 1
            fi
            echo "Waiting for services (${elapsed}/${timeout_seconds} seconds elapsed)..."
            sleep 5
          done
      - name: Configure Keycloak for integration tests
        run: |
          pwsh -NoLogo -NoProfile -File infrastructure/scripts/configure-keycloak-user-profile.ps1
          pwsh -NoLogo -NoProfile -File infrastructure/scripts/configure-keycloak-user-service.ps1
          pwsh -NoLogo -NoProfile -File infrastructure/scripts/configure-keycloak-realm-email.ps1
          pwsh -NoLogo -NoProfile -File infrastructure/scripts/seed-keycloak-users.ps1
      - name: Run integration scripts
        shell: bash
        run: |
          failures=0
          printf '### Docker integration tests\n\n| Script | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for script in infrastructure/scripts/test-*.ps1; do
            name=$(basename "$script")
            if pwsh -NoLogo -NoProfile -File "$script"; then
              result=PASS
            else
              exit_code=$?
              result="FAIL (${exit_code})"
              failures=$((failures + 1))
            fi
            printf '| `%s` | %s |\n' "$name" "$result" >> "$GITHUB_STEP_SUMMARY"
          done
          if (( failures > 0 )); then
            echo "${failures} integration script(s) failed."
            exit 1
          fi
      - name: Capture Compose status and logs
        if: always()
        shell: bash
        run: |
          mkdir -p integration-logs
          if docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml ps --all > integration-logs/compose-ps.txt 2>&1; then
            echo "Compose status captured."
          else
            status=$?
            printf 'docker compose ps exited with status %s\n' "$status" >> integration-logs/compose-ps.txt
          fi
          if docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml logs --no-color > integration-logs/compose-logs.txt 2>&1; then
            echo "Compose logs captured."
          else
            status=$?
            printf 'docker compose logs exited with status %s\n' "$status" >> integration-logs/compose-logs.txt
          fi
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-integration-logs
          path: integration-logs/
          if-no-files-found: error
          retention-days: 7
      - name: Tear down Docker Compose stack and volumes
        if: always()
        run: docker compose -p infrastructure -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.user-service.yml down --volumes --remove-orphans

  # Include the security scans in the required CI result.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  # Provide one required branch-protection check for the complete CI workflow.
  ci-ok:
    needs:
      - shared-library
      - backend
      - frontend
      - integration
      - security
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check prerequisite job results
        env:
          SHARED_LIBRARY_RESULT: ${{ needs.shared-library.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [[ "$SHARED_LIBRARY_RESULT" != "success" || "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" || ( "$INTEGRATION_RESULT" != "success" && "$INTEGRATION_RESULT" != "skipped" ) || "$SECURITY_RESULT" != "success" ]]; then
            echo "CI did not succeed: shared-library=$SHARED_LIBRARY_RESULT, backend=$BACKEND_RESULT, frontend=$FRONTEND_RESULT, integration=$INTEGRATION_RESULT, security=$SECURITY_RESULT"
            exit 1
          fi
          echo "All CI jobs succeeded."
