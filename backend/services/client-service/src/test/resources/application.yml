spring:
  datasource:
    url: jdbc:h2:mem:client_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/legalflow/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/legalflow

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
